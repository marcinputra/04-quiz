server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # DNS Dockera — adres kontenera "api" jest sprawdzany przy żądaniach (co 10 s),
  # a nie tylko raz przy starcie nginx. Dzięki temu:
  #  - frontend startuje, nawet gdy api jeszcze nie działa (wcześniej: "host not found
  #    in upstream" -> restart w kółko -> 502 dla CAŁEJ strony),
  #  - po przebudowie / restarcie api (nowy adres IP) nginx sam trafia pod nowy adres.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  # backend (kontener "api" z docker-compose.yml)
  location /api/ {
    set $api_upstream http://api:4000; # zmienna wymusza ponowne ustalanie adresu
    proxy_pass $api_upstream;          # bez części URI — przekazywany jest oryginalny adres żądania
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # gdy api nie działa — czytelny błąd w JSON zamiast strony nginx
    proxy_intercept_errors off;
    error_page 502 503 504 = @api_down;
  }

  location @api_down {
    default_type application/json;
    return 503 '{"error":"Serwer chwilowo niedostępny. Spróbuj ponownie za chwilę."}';
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
